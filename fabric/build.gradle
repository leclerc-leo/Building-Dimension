plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // Not a real dependency of the mod (see FabricAccessoryHelper: Trinkets is only ever reached via
    // reflection). Set only by scripts/test-accessory-mods.sh, to put a real, downloaded Trinkets jar
    // on the runGameTest classpath so the reflection path can be exercised against the genuine API.
    if (project.hasProperty('accessoryTestJar')) {
        implementation(files(project.property('accessoryTestJar')))
    }
}

fabricApi {
    configureTests {
        createSourceSet = false
        enableGameTests = true
    }
}

// GameTest bodies (net.buildingdimension.test.*, shared with NeoForge) have no business shipping
// in the mod players actually download — they're only ever loaded by Fabric API's own gametest
// runner (the "fabric-gametest" entrypoint, resolved only by -Dfabric-api.gametest=true runs),
// never during ordinary client/server boot, so excluding them from the packaged jar is safe.
tasks.named('jar', Jar) {
    exclude 'net/buildingdimension/test/**'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
